<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yasmine Habchi – Free Trading Call</title>
<meta name="description" content="Book a free call with Yasmine Habchi to discover how our community helps you learn trading for free.">
<meta name="theme-color" content="#e4e4e6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&family=Great+Vibes&family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pearl: #e8e8ea;
    --pearl-2: #dcdde0;
    --mist: #c9cacf;
    --paper: #f4f3f1;
    --ink: #141414;
    --ink-2: #1e1d1c;
    --text: #2a2826;
    --muted: #6f6c69;
    --gold: #b08a57;
    --gold-2: #c9a46e;
    --gold-soft: rgba(176,138,87,0.14);
    --rose: #c78d89;
    --rose-soft: rgba(199,141,137,0.16);
    --line: rgba(20,20,20,0.1);
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Jost', system-ui, sans-serif;
  }
  html[lang="ar"] { --serif: 'Amiri', serif; --sans: 'Tajawal', sans-serif; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--sans); font-weight: 400; background: var(--paper); color: var(--text); line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  html[lang="ar"] body { line-height: 1.9; }
  a { color: inherit; text-decoration: none; }
  img { display: block; }
  .wrap { max-width: 1220px; margin: 0 auto; padding: 0 28px; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 500; color: var(--ink); }
  em { font-style: italic; }
  html[lang="ar"] em { font-style: normal; }

  .eyebrow { display: inline-flex; align-items: center; gap: 14px; font-size: .74rem; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); }
  .eyebrow::before { content: ""; width: 34px; height: 1px; background: var(--gold); }
  html[lang="ar"] .eyebrow { letter-spacing: 0; font-size: .95rem; font-weight: 700; }
  .center { text-align: center; }
  .center .eyebrow::after { content: ""; width: 34px; height: 1px; background: var(--gold); }

  /* ===== Header ===== */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 60; transition: background .4s, box-shadow .4s; }
  header.scrolled { background: rgba(244,243,241,0.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 1px 0 var(--line); }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 84px; gap: 14px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .sig { font-family: 'Great Vibes', cursive; font-size: 2rem; color: var(--ink); line-height: 1; }
  .brand .ln { font-family: 'Jost', sans-serif; font-size: .7rem; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  .nav-right { display: flex; align-items: center; gap: 12px; }

  /* Language dropdown */
  .lang { position: relative; }
  .lang-btn { display: inline-flex; align-items: center; gap: 9px; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.55); backdrop-filter: blur(8px); font: 500 .88rem 'Jost', sans-serif; color: var(--ink); cursor: pointer; transition: .2s; }
  .lang-btn:hover { border-color: var(--gold); }
  .flag { width: 22px; height: 16px; border-radius: 3px; object-fit: cover; box-shadow: 0 0 0 1px rgba(0,0,0,.08); flex: none; }
  .chev { width: 14px; height: 14px; transition: transform .25s; color: var(--muted); }
  .lang.open .chev { transform: rotate(180deg); }
  .lang-menu { position: absolute; top: calc(100% + 10px); inset-inline-end: 0; min-width: 200px; list-style: none; padding: 8px; border-radius: 18px; background: #fff; border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(20,20,20,0.16);
    opacity: 0; visibility: hidden; transform: translateY(-6px); transition: .22s; z-index: 70; }
  .lang.open .lang-menu { opacity: 1; visibility: visible; transform: none; }
  .lang-menu button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; background: transparent; border-radius: 12px; cursor: pointer; font: 400 .95rem 'Jost', sans-serif; color: var(--ink); text-align: start; transition: background .15s; }
  .lang-menu button[data-lang="ar"] { font-family: 'Tajawal', sans-serif; font-size: 1rem; }
  .lang-menu button:hover { background: var(--pearl); }
  .lang-menu button.active { background: var(--gold-soft); }
  .lang-menu button .tick { margin-inline-start: auto; width: 16px; height: 16px; color: var(--gold); opacity: 0; }
  .lang-menu button.active .tick { opacity: 1; }

  .btn-dark { display: inline-flex; align-items: center; gap: 14px; background: var(--ink); color: #fff; font-family: var(--sans); font-weight: 500; font-size: .95rem; letter-spacing: .02em; padding: 8px 8px 8px 26px; border-radius: 999px; transition: .3s; box-shadow: 0 14px 34px rgba(20,20,20,0.22); }
  html[dir="rtl"] .btn-dark { padding: 8px 26px 8px 8px; }
  .btn-dark .arr { width: 42px; height: 42px; border-radius: 50%; background: var(--gold); color: #fff; display: grid; place-items: center; transition: transform .3s; }
  .btn-dark .arr svg { width: 17px; height: 17px; }
  html[dir="rtl"] .btn-dark .arr svg { transform: scaleX(-1); }
  .btn-dark:hover { background: #000; }
  .btn-dark:hover .arr { transform: translateX(4px); }
  html[dir="rtl"] .btn-dark:hover .arr { transform: translateX(-4px); }
  .btn-line { display: inline-flex; align-items: center; padding: 17px 28px; border-radius: 999px; border: 1px solid rgba(20,20,20,0.25); color: var(--ink); font-weight: 500; font-size: .95rem; transition: .3s; }
  .btn-line:hover { border-color: var(--gold); color: var(--gold); }
  .nav-cta { padding: 12px 22px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 500; font-size: .88rem; transition: .25s; }
  .nav-cta:hover { background: var(--gold); }
  @media (max-width: 620px) { .nav-cta { display: none; } .brand .ln { display: none; } }

  /* ===== Hero ===== */
  .hero { position: relative; min-height: 100vh; padding: 130px 0 90px; overflow: hidden; isolation: isolate;
    background: radial-gradient(70% 80% at 80% 40%, #f1f1f2 0%, transparent 60%), linear-gradient(160deg, #e9e9eb 0%, #d7d8dc 55%, #cfd0d4 100%); }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 160px; background: linear-gradient(0deg, var(--paper), transparent); z-index: -1; }
  .lines-bg { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; opacity: .45; }
  .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 64px; align-items: center; }
  .hero h1 { font-size: clamp(2.9rem, 6vw, 5.4rem); line-height: 1.0; letter-spacing: -0.015em; margin: 28px 0 28px; font-weight: 500; }
  html[lang="ar"] .hero h1 { line-height: 1.45; font-size: clamp(2.5rem, 5.4vw, 4.6rem); font-weight: 700; letter-spacing: 0; }
  .hero h1 em { color: var(--gold); font-weight: 400; }
  .lead { font-size: 1.15rem; color: var(--muted); max-width: 520px; font-weight: 300; margin-bottom: 40px; }
  html[lang="ar"] .lead { font-weight: 400; }
  .actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .note { display: flex; align-items: center; gap: 10px; margin-top: 22px; font-size: .88rem; color: var(--muted); }
  .note i { width: 6px; height: 6px; border-radius: 50%; background: var(--rose); }

  .stats { display: flex; margin-top: 54px; max-width: 520px; border-top: 1px solid var(--line); }
  .stat { flex: 1; padding: 22px 0 0; }
  .stat + .stat { padding-inline-start: 26px; border-inline-start: 1px solid var(--line); margin-inline-start: 0; }
  .stat:not(:first-child) { padding-inline-start: 24px; }
  .stat strong { display: block; font-family: 'Cormorant Garamond', serif; font-size: 2.6rem; font-weight: 500; color: var(--ink); line-height: 1; }
  .stat strong b { color: var(--gold); font-weight: 500; }
  .stat span { font-size: .82rem; color: var(--muted); }

  /* Arch portrait */
  .portrait { position: relative; max-width: 470px; width: 100%; margin-inline-start: auto; }
  .arch { position: relative; aspect-ratio: 860/900; border-radius: 999px 999px 28px 28px; overflow: hidden; box-shadow: 0 50px 90px rgba(20,20,20,0.22); }
  .arch img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; transform: scale(1.04); transition: transform 1.6s cubic-bezier(.2,.7,.2,1); }
  .loaded .arch img { transform: scale(1); }
  .arch-line { position: absolute; inset: -18px; border: 1px solid var(--gold); border-radius: 999px 999px 40px 40px; opacity: .7; pointer-events: none; }
  .sparkle { position: absolute; color: var(--gold); width: 26px; height: 26px; animation: twinkle 4s ease-in-out infinite; }
  .sparkle.s1 { top: 6%; inset-inline-start: -8%; }
  .sparkle.s2 { bottom: 30%; inset-inline-end: -9%; width: 18px; height: 18px; animation-delay: -2s; }
  @keyframes twinkle { 50% { opacity: .3; transform: scale(.8) rotate(20deg); } }
  .float { position: absolute; z-index: 2; background: rgba(255,255,255,0.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.9); border-radius: 20px; padding: 14px 18px; box-shadow: 0 20px 44px rgba(20,20,20,0.14); animation: bob 7s ease-in-out infinite; }
  .float.f1 { bottom: 14%; inset-inline-start: -16%; display: flex; gap: 12px; align-items: center; }
  .float.f2 { top: 22%; inset-inline-end: -12%; animation-delay: -3.5s; }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  .f1 .ic { width: 42px; height: 42px; border-radius: 50%; background: var(--rose-soft); color: var(--rose); display: grid; place-items: center; }
  .f1 .ic svg { width: 20px; height: 20px; }
  .float b { display: block; color: var(--ink); font-weight: 500; font-size: .92rem; line-height: 1.3; }
  .float span { font-size: .76rem; color: var(--muted); }
  .f2 .sig { font-family: 'Great Vibes', cursive; font-size: 1.7rem; color: var(--ink); line-height: 1.1; display: block; }
  .f2 svg { width: 90px; height: 26px; display: block; margin-top: 4px; }


  /* Trading candles */
  .cchart { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }
  .hero .cchart { opacity: .9; }
  .hero-shade { position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(90deg, rgba(233,233,235,0.86) 0%, rgba(233,233,235,0.55) 42%, rgba(233,233,235,0.1) 72%, rgba(233,233,235,0.35) 100%); }
  html[dir="rtl"] .hero-shade { background: linear-gradient(270deg, rgba(233,233,235,0.86) 0%, rgba(233,233,235,0.55) 42%, rgba(233,233,235,0.1) 72%, rgba(233,233,235,0.35) 100%); }
  .about .cchart { z-index: 0; opacity: .45; }
  .closing .cchart { z-index: 0; opacity: .4; }
  .up { color: #1f9d74; } .down { color: #d9534f; }
  .stat strong .tr { display: inline-block; font-size: .45em; vertical-align: middle; margin-inline-start: 6px; color: #1f9d74; }
  @media (max-width: 920px) { .hero-shade, html[dir="rtl"] .hero-shade { background: linear-gradient(0deg, rgba(233,233,235,0.95) 0%, rgba(233,233,235,0.75) 45%, rgba(233,233,235,0.25) 100%); } }

  /* ===== Marquee ===== */
  .marquee { background: var(--ink); color: #f1ece4; overflow: hidden; padding: 22px 0; direction: ltr; }
  .track { display: flex; gap: 46px; width: max-content; animation: scroll 50s linear infinite; }
  .track span { display: inline-flex; align-items: center; gap: 46px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.5rem; white-space: nowrap; }
  .track span::after { content: "▲"; font-style: normal; color: #2fbf8f; font-size: .75rem; }
  .track span:nth-child(3n)::after { content: "▼"; color: #e5686c; }
  @keyframes scroll { to { transform: translateX(-50%); } }

  /* ===== Sections ===== */
  section { padding: 130px 0; position: relative; }
  h2 { font-size: clamp(2.4rem, 5vw, 4.2rem); line-height: 1.08; margin: 22px 0 18px; letter-spacing: -0.01em; }
  html[lang="ar"] h2 { line-height: 1.5; font-weight: 700; letter-spacing: 0; }
  h2 em { color: var(--gold); font-weight: 400; }
  .sub { color: var(--muted); font-size: 1.08rem; max-width: 560px; font-weight: 300; }
  html[lang="ar"] .sub { font-weight: 400; }
  .center .sub { margin: 0 auto; }

  .statement { text-align: center; padding: 140px 0 120px; }
  .statement h2 { max-width: 980px; margin: 26px auto 0; font-size: clamp(2.3rem, 5.4vw, 4.6rem); line-height: 1.12; }
  .statement h2 em { color: var(--rose); }
  .statement h2 .dim { color: rgba(20,20,20,0.35); }

  /* About (dark, like the blazer) */
  .about { background: var(--ink); color: #e9e4dc; border-radius: 48px; margin: 0 20px; padding: 120px 0; overflow: hidden; }
  .about::before { content: ""; position: absolute; top: -200px; inset-inline-end: -150px; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(closest-side, rgba(176,138,87,0.28), transparent); }
  .about-grid { position: relative; display: grid; grid-template-columns: 1fr 1.1fr; gap: 80px; align-items: center; }
  .about h2 { color: #fff; }
  .about .big { font-family: 'Cormorant Garamond', serif; font-size: clamp(7rem, 16vw, 13rem); line-height: .85; color: var(--gold-2); font-weight: 400; }
  .about .big small { font-size: .45em; vertical-align: top; }
  .about .lbl { font-size: .74rem; letter-spacing: .28em; text-transform: uppercase; color: rgba(233,228,220,0.6); margin-top: 18px; }
  html[lang="ar"] .about .lbl { letter-spacing: 0; font-size: 1rem; }
  .about .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; }
  .about .row { padding: 18px 20px; border-radius: 18px; border: 1px solid rgba(233,228,220,0.14); }
  .about .row small { display: block; color: rgba(233,228,220,0.55); font-size: .8rem; }
  .about .row b { color: #fff; font-weight: 500; }
  .about p { color: rgba(233,228,220,0.75); font-size: 1.1rem; font-weight: 300; }
  html[lang="ar"] .about p { font-weight: 400; }
  .about p + p { margin-top: 18px; }
  .about strong { color: #fff; font-weight: 500; }
  .about .btn-dark { background: #fff; color: var(--ink); margin-top: 38px; box-shadow: none; }
  .about .btn-dark:hover { background: var(--gold-2); color: #fff; }

  /* Features */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 64px; }
  .card { position: relative; background: #fff; border-radius: 28px; padding: 34px 28px 32px; border: 1px solid var(--line); transition: transform .4s, box-shadow .4s; }
  .card:hover { transform: translateY(-8px); box-shadow: 0 30px 60px rgba(20,20,20,0.1); }
  .card .no { position: absolute; top: 26px; inset-inline-end: 28px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.1rem; color: var(--mist); }
  .icon { width: 58px; height: 58px; border-radius: 50%; background: var(--pearl); display: grid; place-items: center; color: var(--gold); margin-bottom: 28px; transition: .4s; }
  .card:hover .icon { background: var(--ink); color: var(--gold-2); }
  .icon svg { width: 24px; height: 24px; }
  .card h3 { font-size: 1.6rem; margin-bottom: 10px; line-height: 1.2; }
  html[lang="ar"] .card h3 { font-size: 1.4rem; font-weight: 700; }
  .card p { color: var(--muted); font-size: .96rem; font-weight: 300; }
  html[lang="ar"] .card p { font-weight: 400; }

  /* Steps */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 70px; }
  .step { position: relative; }
  .step .n { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 4.4rem; line-height: 1; color: var(--gold); opacity: .9; }
  .step h3 { font-size: 1.8rem; margin: 14px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); }
  html[lang="ar"] .step h3 { font-size: 1.5rem; font-weight: 700; }
  .step p { color: var(--muted); font-weight: 300; }
  html[lang="ar"] .step p { font-weight: 400; }

  /* Booking */
  .book { background: linear-gradient(180deg, var(--paper), var(--pearl)); }
  .book-grid { display: grid; grid-template-columns: .85fr 1.15fr; gap: 64px; align-items: start; }
  .checks { list-style: none; margin-top: 34px; display: grid; gap: 4px; }
  .checks li { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); color: var(--ink); }
  .checks li i { width: 28px; height: 28px; border-radius: 50%; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; flex: none; }
  .checks li i svg { width: 14px; height: 14px; }
  .mini-portrait { display: flex; align-items: center; gap: 14px; margin-top: 34px; padding: 14px; border-radius: 20px; background: #fff; border: 1px solid var(--line); max-width: 360px; }
  .mini-portrait img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; object-position: center 15%; }
  .mini-portrait .sig { font-family: 'Great Vibes', cursive; font-size: 1.6rem; color: var(--ink); line-height: 1.1; }
  .mini-portrait span { display: block; font-size: .8rem; color: var(--muted); }
  .booking-box { background: #fff; border-radius: 30px; padding: 10px; border: 1px solid var(--line); box-shadow: 0 40px 90px rgba(20,20,20,0.12); }
  .booking-inner { border-radius: 22px; overflow: hidden; }
  .calendly-inline-widget { min-width: 300px; height: 720px; }
  @media (max-width: 640px) { .calendly-inline-widget { height: 1050px; } }

  /* FAQ */
  .faq { max-width: 820px; margin: 56px auto 0; }
  details { border-bottom: 1px solid var(--line); }
  summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 28px 4px; font-family: var(--serif); font-size: 1.55rem; color: var(--ink); }
  html[lang="ar"] summary { font-size: 1.3rem; font-weight: 700; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: ""; flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: no-repeat center/14px url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b08a57' stroke-width='2.2' stroke-linecap='round'><path d='M12 5v14M5 12h14'/></svg>"); transition: transform .35s, background-color .35s; }
  details[open] summary::after { transform: rotate(45deg); background-color: var(--gold-soft); }
  details p { color: var(--muted); padding: 0 4px 28px; max-width: 680px; font-weight: 300; }
  html[lang="ar"] details p { font-weight: 400; }

  /* Closing */
  .closing { position: relative; display: grid; grid-template-columns: 1.3fr .7fr; align-items: center; gap: 30px; background: var(--ink); border-radius: 40px; overflow: hidden; padding: 0 0 0 70px; min-height: 420px; }
  html[dir="rtl"] .closing { padding: 0 70px 0 0; }
  .closing .txt { padding: 70px 0; position: relative; z-index: 1; }
  .closing h2 { color: #fff; margin-top: 18px; }
  .closing .sub { color: rgba(233,228,220,0.7); margin-bottom: 36px; }
  .closing .btn-dark { background: #fff; color: var(--ink); box-shadow: none; }
  .closing .btn-dark:hover { background: var(--gold-2); color: #fff; }
  .closing .img { align-self: stretch; position: relative; }
  .closing .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 15%;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 45%); mask-image: linear-gradient(90deg, transparent 0%, #000 45%); }
  html[dir="rtl"] .closing .img img { -webkit-mask-image: linear-gradient(270deg, transparent 0%, #000 45%); mask-image: linear-gradient(270deg, transparent 0%, #000 45%); }

  footer { padding: 70px 0 44px; }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 18px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  .social { display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); font-weight: 500; font-size: .9rem; transition: .25s; }
  .social:hover { border-color: var(--gold); color: var(--gold); }
  .social svg { width: 18px; height: 18px; }
  .legal { margin-top: 22px; font-size: .78rem; color: var(--muted); max-width: 760px; }

  /* Reveal + intro */
  .reveal { opacity: 0; transform: translateY(34px); transition: opacity 1s cubic-bezier(.2,.7,.2,1), transform 1s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  .intro > * { opacity: 0; transform: translateY(24px); transition: opacity 1s cubic-bezier(.2,.7,.2,1), transform 1s cubic-bezier(.2,.7,.2,1); }
  .loaded .intro > * { opacity: 1; transform: none; }
  .loaded .intro > *:nth-child(2) { transition-delay: .12s; } .loaded .intro > *:nth-child(3) { transition-delay: .24s; }
  .loaded .intro > *:nth-child(4) { transition-delay: .36s; } .loaded .intro > *:nth-child(5) { transition-delay: .48s; }
  .portrait { opacity: 0; transform: translateY(30px); transition: opacity 1.2s .2s, transform 1.2s .2s cubic-bezier(.2,.7,.2,1); }
  .loaded .portrait { opacity: 1; transform: none; }

  /* ===== Responsive ===== */
  @media (max-width: 1060px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 920px) {
    .hero { padding-top: 110px; }
    .hero-grid { grid-template-columns: 1fr; gap: 56px; }
    .portrait { order: -1; margin: 0 auto; max-width: 340px; }
    .hero-text { text-align: center; }
    .lead { margin-inline: auto; }
    .actions, .note { justify-content: center; }
    .stats { margin-inline: auto; text-align: center; }
    .float.f1 { inset-inline-start: -10%; bottom: 8%; }
    .float.f2 { inset-inline-end: -8%; top: 14%; }
    .about { margin: 0 10px; border-radius: 32px; padding: 90px 0; }
    .about-grid, .book-grid { grid-template-columns: 1fr; gap: 50px; }
    .steps { grid-template-columns: 1fr; gap: 50px; }
    section { padding: 90px 0; }
    .statement { padding: 100px 0 80px; }
    .closing { grid-template-columns: 1fr; padding: 0 !important; text-align: center; }
    .closing .txt { padding: 60px 26px 10px; }
    .closing .img { height: 300px; order: 2; }
    .closing .img img { -webkit-mask-image: linear-gradient(0deg, #000 55%, transparent 100%) !important; mask-image: linear-gradient(0deg, #000 55%, transparent 100%) !important; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 20px; }
    .grid { grid-template-columns: 1fr; }
    .portrait { max-width: 290px; }
    .float.f1 { display: none; }
    .float.f2 { inset-inline-end: -10%; top: auto; bottom: 8%; padding: 10px 14px; }
    .f1 .ic { width: 34px; height: 34px; }
    .f2 .sig { font-size: 1.4rem; }
    .stat strong { font-size: 2.1rem; }
    .stat:not(:first-child) { padding-inline-start: 14px; }
    .about .rows { grid-template-columns: 1fr; }
    summary { font-size: 1.3rem; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .reveal, .intro > *, .portrait { opacity: 1 !important; transform: none !important; } }
</style>

function setLang(lang) {
  if (!T[lang]) lang = "en";
  const html = document.documentElement;
  html.lang = lang; html.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = T[lang][el.dataset.i18n]; if (v !== undefined) el.innerHTML = v; });
  document.getElementById("curFlag").src = FLAGS[lang];
  document.getElementById("curCode").textContent = lang.toUpperCase();
  document.querySelectorAll(".lang-menu button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  const items = T[lang].ticker.concat(T[lang].ticker);
  document.getElementById("track").innerHTML = items.concat(items).map(t => "<span>" + t + "</span>").join("");
  try { localStorage.setItem("lang", lang); } catch (e) {}
}

/* Dropdown */
const langBox = document.getElementById("lang"), langBtn = document.getElementById("langBtn");
langBtn.addEventListener("click", e => { e.stopPropagation(); const o = langBox.classList.toggle("open"); langBtn.setAttribute("aria-expanded", o); });
document.querySelectorAll(".lang-menu button").forEach(b => b.addEventListener("click", () => { setLang(b.dataset.lang); langBox.classList.remove("open"); langBtn.setAttribute("aria-expanded", false); }));
document.addEventListener("click", () => { langBox.classList.remove("open"); langBtn.setAttribute("aria-expanded", false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") langBox.classList.remove("open"); });

let start = "en";
try { const s = localStorage.getItem("lang"); if (s) start = s; else { const n = (navigator.language || "en").slice(0, 2); if (T[n]) start = n; } } catch (e) {}
setLang(start);

document.querySelectorAll("img.dup").forEach(i => i.src = document.querySelector(".arch img").src);

/* Header */
const hdr = document.getElementById("hdr");
addEventListener("scroll", () => hdr.classList.toggle("scrolled", scrollY > 20), { passive: true });

/* Intro + reveal */
requestAnimationFrame(() => setTimeout(() => document.body.classList.add("loaded"), 80));
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll(".reveal").forEach((el, i) => { el.style.transitionDelay = (i % 4) * 100 + "ms"; io.observe(el); });


/* Animated trading candles (green = up, red = down) */
function candleChart(cv, o) {
  if (!cv) return;
  const ctx = cv.getContext("2d"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, step, cs = [], off = 0;
  const nx = p => { const op = p ? p.c : 100, c = op + (Math.random() - .44) * 5, h = Math.max(op, c) + Math.random() * 2.4, l = Math.min(op, c) - Math.random() * 2.4; return { o: op, c, h, l }; };
  function init() {
    const d = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; if (!W || !H) return;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    step = W < 700 ? 16 : o.step; cs = []; let p = null;
    for (let i = 0; i < Math.ceil(W / step) + 3; i++) { p = nx(p); cs.push(p); }
  }
  function draw() {
    if (!W) return; ctx.clearRect(0, 0, W, H);
    let mx = -1e9, mn = 1e9; cs.forEach(k => { mx = Math.max(mx, k.h); mn = Math.min(mn, k.l); });
    const t = H * o.top, b = H * o.bot, Y = v => b - (v - mn) / (mx - mn || 1) * (b - t);
    const pts = cs.map((k, i) => { const s = cs.slice(Math.max(0, i - 9), i + 1); return [i * step - off + step / 2, Y(s.reduce((a, q) => a + q.c, 0) / s.length)]; });
    ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.strokeStyle = o.ma; ctx.lineWidth = 1.8; ctx.stroke();
    const bw = Math.max(5, step * .55);
    cs.forEach((k, i) => {
      const x = i * step - off + step / 2, up = k.c >= k.o;
      ctx.strokeStyle = ctx.fillStyle = up ? o.up : o.down; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(x, Y(k.h)); ctx.lineTo(x, Y(k.l)); ctx.stroke();
      const y1 = Y(Math.max(k.o, k.c)), y2 = Y(Math.min(k.o, k.c));
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - bw / 2, y1, bw, Math.max(2, y2 - y1), 2) : ctx.rect(x - bw / 2, y1, bw, Math.max(2, y2 - y1)); ctx.fill();
    });
    const last = cs[cs.length - 3], ly = Y(last.c), lu = last.c >= last.o;
    ctx.setLineDash([4, 6]); ctx.strokeStyle = lu ? o.up : o.down; ctx.globalAlpha = .6; ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  function loop() {
    off += o.speed;
    if (off >= step) { off -= step; cs.shift(); cs.push(nx(cs[cs.length - 1]));
      const lc = cs[cs.length - 1].c; if (lc > 180 || lc < 30) { const d = lc - 100; cs.forEach(k => { k.o -= d; k.c -= d; k.h -= d; k.l -= d; }); } }
    draw(); requestAnimationFrame(loop);
  }
  init(); draw(); addEventListener("resize", () => { init(); draw(); });
  if (!reduce) requestAnimationFrame(loop);
}
